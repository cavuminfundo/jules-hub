[project]
name = "julius-hub"
version = "0.2.1"
description = "Autonomous junior AI coder runner & tech lead cockpit"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
readme = "README.md"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["hub"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

